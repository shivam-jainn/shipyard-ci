name: Shipyard Agent Regression Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main]

jobs:
  shipyard-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Shipyard Evaluations
        uses: shivam-jainn/shipyard-ci@v1
        with:
          path: 'evalset/'
          post-comment: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload ATIF Trajectory Rollouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipyard-trajectories
          path: evalset/rollouts/
          retention-days: 14
